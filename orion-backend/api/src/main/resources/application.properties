spring.application.name=api

# Carga las credenciales desde un archivo .env (formato properties).
# Se busca en dos rutas para que funcione sin importar el working directory:
#  - .env        → si se corre desde orion-backend/api (CLI, o IntelliJ con cwd=módulo)
#  - api/.env     → si se corre desde orion-backend (IntelliJ con cwd=raíz del repo back)
# 'optional:' = no falla si no existe (p. ej. en Railway usa el entorno real).
# Las variables de entorno del SO tienen prioridad sobre el .env.
spring.config.import=optional:file:.env[.properties],optional:file:api/.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Alinea el JSON con el contrato del doc 05 (snake_case): password_temporal, num_tracking, etc.
spring.jackson.property-naming-strategy=SNAKE_CASE

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

exchangerate.api.key=${EXCHANGE_API_KEY}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server.port=8080
server.servlet.context-path=/api/v1