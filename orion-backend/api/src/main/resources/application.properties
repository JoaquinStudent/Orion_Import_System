spring.application.name=api

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Alinea el JSON con el contrato del doc 05 (snake_case): password_temporal, num_tracking, etc.
spring.jackson.property-naming-strategy=SNAKE_CASE

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

exchangerate.api.key=${EXCHANGE_API_KEY}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server.port=8080
server.servlet.context-path=/api/v1
spring.config.import=optional:file:.env[.properties],optional:file:api/.env[.properties]